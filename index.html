    <style>
      /* Custom scrollbar for playlists */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1f2937; 
      }
      ::-webkit-scrollbar-thumb {
        background: #4b5563; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #6b7280; 
      }
      
      /* Lens Shape Utilities */
      .lens-shape-left {
        border-radius: 10% 10% 40% 30% / 20% 20% 45% 40%;
      }
      .lens-shape-right {
        border-radius: 10% 10% 30% 40% / 20% 20% 40% 45%;
      }
    </style>
